<div class="adm-metrics">
  <div class="adm-metric is-primary">
    <div class="adm-metric-k">{{ responses_total }}</div>
    <div class="adm-metric-l">Réponses collectées</div>
  </div>
  <div class="adm-metric">
    <div class="adm-metric-k">{{ users_total }}</div>
    <div class="adm-metric-l">Utilisateurs</div>
  </div>
  <div class="adm-metric">
    <div class="adm-metric-k">{{ users_active_7d }}</div>
    <div class="adm-metric-l">Actifs · 7 j</div>
  </div>
  <div class="adm-metric">
    <div class="adm-metric-k">{{ forms_total }}</div>
    <div class="adm-metric-l">Formulaires</div>
  </div>
  <div class="adm-metric">
    <div class="adm-metric-k">{{ forms_active }}</div>
    <div class="adm-metric-l">Formulaires actifs</div>
  </div>
  <div class="adm-metric">
    <div class="adm-metric-k">{{ publish_rate }}<span style="font-size:1rem;color:var(--a-muted)"> %</span></div>
    <div class="adm-metric-l">Taux de publication</div>
  </div>
  <div class="adm-metric">
    <div class="adm-metric-k">{{ avg_responses }}</div>
    <div class="adm-metric-l">Réponses / formulaire</div>
  </div>
</div>
