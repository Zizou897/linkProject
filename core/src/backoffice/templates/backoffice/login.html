{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Connexion — Espace admin Vozavi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="{% static 'app/css/vozavi.css' %}">
<link rel="stylesheet" href="{% static 'app/css/backoffice.css' %}">
<style>
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 90% at 50% -10%, #292647 0%, var(--a-rail) 55%, #131126 100%)}
.lg{width:100%;max-width:392px}
.lg-mark{display:flex;align-items:center;justify-content:center;gap:9px;color:#fff;font-family:var(--fh);font-weight:700;font-size:1.12rem;margin-bottom:20px}
.lg-mark .dot{width:9px;height:9px;border-radius:50%;background:var(--amb);box-shadow:0 0 0 4px rgba(242,169,59,.2)}
.lg-mark .q{color:rgba(255,255,255,.5);font-weight:500}
.lg-card{background:var(--a-surface);border-radius:var(--a-r-lg);box-shadow:var(--a-sh-pop);padding:30px 28px}
.lg-h{font-family:var(--fh);font-weight:700;font-size:1.15rem;color:var(--a-ink);text-align:center}
.lg-sub{text-align:center;color:var(--a-muted);font-size:.82rem;margin:5px 0 22px}
.lg-error{display:flex;align-items:center;gap:8px;background:var(--a-neg-bg);color:var(--a-neg);border-radius:var(--a-r-sm);padding:10px 12px;font-size:.82rem;margin-bottom:16px;font-family:var(--fb)}
.lg-error svg{width:16px;height:16px;flex-shrink:0}
.lg .adm-field{margin-bottom:14px}
.lg-foot{text-align:center;margin-top:18px}
.lg-foot a{color:rgba(255,255,255,.62);font-size:.8rem;font-family:var(--fb)}
.lg-foot a:hover{color:#fff}
</style>
</head>
<body>
<div class="lg">
  <div class="lg-mark"><span class="dot"></span>vozavi <span class="q">admin</span></div>
  <form class="lg-card" method="post" action="{% url 'bo_login' %}" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="lg-h">Espace admin</div>
    <div class="lg-sub">Accès réservé aux administrateurs</div>
    {% if error %}
    <div class="lg-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01" stroke-linecap="round"/></svg>
      {{ error }}
    </div>
    {% endif %}
    <div class="adm-field">
      <label class="adm-label" for="username">Identifiant</label>
      <input class="adm-input" type="text" id="username" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="adm-field">
      <label class="adm-label" for="password">Mot de passe</label>
      <input class="adm-input" type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="adm-btn adm-btn-primary" style="width:100%;margin-top:8px;height:42px">Se connecter</button>
  </form>
  <div class="lg-foot"><a href="{% url 'home' %}">← Retour au site</a></div>
</div>
</body>
</html>
