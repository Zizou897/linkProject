{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="{% static 'app/assets/img/favicon.svg' %}">
<link rel="icon" type="image/png" sizes="48x48" href="{% static 'app/assets/img/favicon-48.png' %}">
<link rel="icon" type="image/png" sizes="96x96" href="{% static 'app/assets/img/favicon-96.png' %}">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'app/assets/img/favicon-192.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'app/assets/img/apple-touch-icon.png' %}"><rect width='64' height='64' rx='14' fill='%234F46B8'/><path d='M32 12 l4.2 8.5 9.4 1.4 -6.8 6.6 1.6 9.4 -8.4-4.4 -8.4 4.4 1.6-9.4 -6.8-6.6 9.4-1.4 z' fill='%23F2A93B'/></svg>">
<title>Mot de passe réinitialisé — Vozavi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--indigo:#4F46B8;--indigo-d:#3D35A0;--green:#1D9E75;--green-pale:#E8F8F3;--lavender:#F4F3FB;--white:#fff;--text:#2C2C3A;--text-2:#5C5C72;--shadow-md:0 8px 24px rgba(44,44,58,.12);--radius:14px;--f-head:'Poppins',sans-serif;--f-body:'Inter',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-body);color:var(--text);background:var(--lavender);-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
a{text-decoration:none;color:inherit}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-md);max-width:430px;width:100%;padding:40px 34px;text-align:center}
.icon{width:66px;height:66px;border-radius:50%;background:var(--green-pale);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.icon svg{width:32px;height:32px;color:var(--green)}
h1{font-family:var(--f-head);font-weight:700;font-size:1.375rem;color:var(--text);letter-spacing:-.02em;margin-bottom:10px}
.sub{font-size:.9375rem;color:var(--text-2);line-height:1.65;margin-bottom:26px}
.btn-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 26px;border-radius:10px;background:var(--indigo);color:var(--white);font-family:var(--f-head);font-weight:600;font-size:.9375rem;transition:background .18s,transform .15s,box-shadow .18s}
.btn-link:hover{background:var(--indigo-d);box-shadow:0 6px 18px rgba(79,70,184,.3);transform:translateY(-1px)}
.btn-link svg{width:15px;height:15px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5 11-12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1>Mot de passe réinitialisé&nbsp;!</h1>
  <p class="sub">Votre mot de passe a été modifié avec succès. Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
  <a href="{% url 'login' %}" class="btn-link">
    <svg viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Se connecter
  </a>
</div>
</body>
</html>
