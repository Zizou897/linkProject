<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%234F46B8'/><path d='M32 12 l4.2 8.5 9.4 1.4 -6.8 6.6 1.6 9.4 -8.4-4.4 -8.4 4.4 1.6-9.4 -6.8-6.6 9.4-1.4 z' fill='%23F2A93B'/></svg>">
<title>Mot de passe oublié — Vozavi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--indigo:#4F46B8;--indigo-d:#3D35A0;--indigo-pale:#EEEDFB;--amber:#F2A93B;--red:#E24B4A;--lavender:#F4F3FB;--white:#fff;--text:#2C2C3A;--text-2:#5C5C72;--text-3:#9B9BB5;--border:#E2E1F0;--shadow-md:0 8px 24px rgba(44,44,58,.12);--radius:14px;--radius-sm:10px;--f-head:'Poppins',sans-serif;--f-body:'Inter',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-body);color:var(--text);background:var(--lavender);-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit;border:none;background:none}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-md);max-width:430px;width:100%;padding:38px 34px}
.logo{display:flex;justify-content:center;margin-bottom:26px}
.logo svg{height:26px}
.icon{width:56px;height:56px;border-radius:50%;background:var(--indigo-pale);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.icon svg{width:26px;height:26px;color:var(--indigo)}
h1{font-family:var(--f-head);font-weight:700;font-size:1.375rem;color:var(--text);letter-spacing:-.02em;text-align:center;margin-bottom:8px}
.sub{font-size:.9rem;color:var(--text-2);line-height:1.6;text-align:center;margin-bottom:26px}
.alert-error{background:#FEF2F2;border:1px solid rgba(226,75,74,.2);border-radius:9px;padding:11px 14px;margin-bottom:18px;font-size:.85rem;color:var(--red);line-height:1.5}
.field-group{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.field-label{font-family:var(--f-head);font-size:.8125rem;font-weight:600;color:var(--text)}
.field-input{width:100%;height:46px;padding:0 14px;border:1.5px solid var(--border);border-radius:10px;font-family:var(--f-body);font-size:.9375rem;color:var(--text);background:var(--white);outline:none;transition:border-color .18s,box-shadow .18s}
.field-input:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,184,.1)}
.btn-submit{width:100%;height:48px;border-radius:10px;background:var(--indigo);color:var(--white);font-family:var(--f-head);font-weight:600;font-size:.9375rem;transition:background .18s,transform .15s,box-shadow .18s}
.btn-submit:hover{background:var(--indigo-d);box-shadow:0 6px 18px rgba(79,70,184,.3);transform:translateY(-1px)}
.back{display:block;text-align:center;font-size:.875rem;color:var(--text-2);margin-top:20px}
.back a{color:var(--indigo);font-weight:600}
.back a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <a href="{% url 'home' %}" class="logo" aria-label="Vozavi">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64">
      <path d="M10 14 a10 10 0 0 1 10-10 h24 a10 10 0 0 1 10 10 v20 a10 10 0 0 1-10 10 h-14 l-9 9 v-9 h-1 a10 10 0 0 1-10-10 z" fill="#4F46B8"/>
      <path d="M32 12 l3.4 6.9 7.6 1.1 -5.5 5.4 1.3 7.6 -6.8-3.6 -6.8 3.6 1.3-7.6 -5.5-5.4 7.6-1.1 z" fill="#F2A93B"/>
      <text x="68" y="40" font-size="28" font-weight="600" fill="#4F46B8" font-family="Poppins,'Segoe UI',Arial,sans-serif">vozavi</text>
    </svg>
  </a>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></svg>
  </div>
  <h1>Mot de passe oublié&nbsp;?</h1>
  <p class="sub">Saisissez l'adresse e-mail de votre compte. Nous vous enverrons un lien pour le réinitialiser.</p>

  {% if form.errors %}
  <div class="alert-error" role="alert">Veuillez saisir une adresse e-mail valide.</div>
  {% endif %}

  <form method="post" novalidate>
    {% csrf_token %}
    <div class="field-group">
      <label class="field-label" for="id_email">Adresse e-mail</label>
      <input type="email" name="email" id="id_email" class="field-input" placeholder="vous@exemple.com" autocomplete="email" required>
    </div>
    <button type="submit" class="btn-submit">Envoyer le lien</button>
  </form>

  <p class="back">Vous vous souvenez&nbsp;? <a href="{% url 'login' %}">Se connecter</a></p>
</div>
</body>
</html>
